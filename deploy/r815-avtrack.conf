# AvTrack prototype proxy on r815 -- lightweight reverse proxy only.
# The actual backend (FastAPI + PostGIS + ADS-B polling) runs on the dev box
# (192.168.0.57:8000), not on r815, per Gerry's request to keep load off r815.
# See /home/gerry/CAP/AvTrack/REQUIREMENTS.md.
#
# HTTPS (added 2026-09-13): reuses the existing wxcop.duckdns.org Let's Encrypt cert --
# our ServerName is already that same hostname, just a different port, so no new cert
# needed. Apache terminates TLS here and proxies to the backend over plain HTTP/WS on
# the LAN, which is fine (192.168.0.57 is not internet-reachable itself). The frontend
# (frontend/src/main.js) already auto-selects ws:// vs wss:// based on
# location.protocol, so this needed no frontend change.

Listen 192.168.0.200:2468
Listen 209.248.90.253:2468

<VirtualHost *:2468>
    ServerName wxcop.duckdns.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/wxcop.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wxcop.duckdns.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # No app-level auth exists in AvTrack yet (REQUIREMENTS.md open question 7) --
    # this is a stopgap so live-exercise tracking data isn't wide open on a public IP.
    <Location />
        AuthType Basic
        AuthName "AvTrack (prototype)"
        AuthUserFile /etc/apache2/avtrack.htpasswd
        Require valid-user
    </Location>

    ProxyPreserveHost On

    # WebSocket live position feed -- must precede the catch-all "/" ProxyPass below
    # (Apache matches ProxyPass entries in listed order).
    ProxyPass /ws/positions ws://192.168.0.57:8000/ws/positions
    ProxyPassReverse /ws/positions ws://192.168.0.57:8000/ws/positions

    ProxyPass / http://192.168.0.57:8000/
    ProxyPassReverse / http://192.168.0.57:8000/

    ErrorLog ${APACHE_LOG_DIR}/avtrack_error.log
    CustomLog ${APACHE_LOG_DIR}/avtrack_access.log combined
    LogLevel warn
</VirtualHost>
